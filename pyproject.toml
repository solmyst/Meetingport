[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meetingport"
version = "2.0.0"
description = "Vanish from a video call with an anime hand sign. Your empty room stays on camera."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "solmyst" }]
keywords = ["virtual-camera", "mediapipe", "obs", "gestures"]
dependencies = [
    "mediapipe==0.10.31",
    "opencv-python==4.11.0.86",
    "numpy==2.5.5",
    "pyvirtualcam==0.15.0",
    "sounddevice==0.5.6",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
meetingport = "mport.app:main"

[project.urls]
Homepage = "https://github.com/solmyst/Meetingport"

[tool.setuptools.packages.find]
include = ["mport*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
